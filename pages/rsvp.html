    <button class="nav-toggle" type="button" data-nav-toggle aria-expanded="false" aria-controls="site-nav">
      <span class="nav-toggle-bar"></span>

    </nav>

  <main id="main">
    <section class="hero page-hero">
      <p class="eyebrow">Kindly reply</p>
      <h1 class="hero-names">
        <span class="hero-name">RSVP</span>
      </h1>
      <div class="flourish flourish-sm" role="presentation"></div>
    </section>

    <section class="section rsvp">
      <div class="rsvp-panel reveal">
        <div class="section-heading">
          <p class="section-lede">We hope you can join us. Please respond by May 15, 2027. Start typing your last name, then choose the names on your invitation so everything stays spelled just as we have it.</p>
        </div>
        <form class="rsvp-form" data-rsvp-form novalidate>
          <div class="form-row lookup" data-lookup="last">
            <label for="guest-last">Last name</label>
            <input id="guest-last" name="last" type="text" autocomplete="off" spellcheck="false" required placeholder="Start typing your last name" aria-autocomplete="list" aria-expanded="false" aria-controls="last-options">
            <ul class="lookup-list" id="last-options" role="listbox" hidden></ul>
            <input type="hidden" name="lastCanonical" data-lookup-value>
          </div>
          <div class="form-row lookup" data-lookup="first">
            <label for="guest-first">First name / names on the invitation</label>
            <input id="guest-first" name="first" type="text" autocomplete="off" spellcheck="false" required disabled placeholder="Choose a last name first" aria-autocomplete="list" aria-expanded="false" aria-controls="first-options">
            <ul class="lookup-list" id="first-options" role="listbox" hidden></ul>
            <input type="hidden" name="firstCanonical" data-lookup-value>
          </div>
          <div class="form-row">
            <label for="guest-email">Email</label>
            <input id="guest-email" name="email" type="email" autocomplete="email" required>
          </div>
          <div class="form-row">
            <label for="attending">Will you attend?</label>
            <select id="attending" name="attending" required>
              <option value="" disabled selected>Please choose</option>
              <option value="Yes">Joyfully accepts</option>
              <option value="No">Regretfully declines</option>
            </select>
          </div>
          <div class="form-row">
            <label for="song-request">Song request</label>
            <textarea id="song-request" name="song" rows="2" required placeholder="A song you’d love to hear…"></textarea>
          </div>
          <div class="form-row">
            <label for="message">Notes / things we should know <span class="optional">(optional)</span></label>
            <textarea id="message" name="notes" rows="4" placeholder="Dietary notes or anything else we should know…"></textarea>
          </div>
          <p class="form-status" data-form-status hidden></p>
          <div class="form-actions">
            <button class="btn rsvp-again" type="button" data-rsvp-overwrite style="display:none">Submit again</button>
            <button class="btn" type="submit">Send RSVP</button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <a class="footer-logo" href="home.html"><img src="../assets/images/Cahoon%20Logo.png" alt="Alyssa and Liam Cahoon"></a>
  </footer>
