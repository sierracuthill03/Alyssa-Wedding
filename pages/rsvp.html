<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="RSVP to Alyssa and Liam Cahoon’s wedding on June 26, 2027.">
  <meta name="theme-color" content="#e4edf3">
  <title>RSVP — Alyssa &amp; Liam Cahoon</title>
  <link rel="icon" href="../assets/images/Cahoon%20Logo.png" type="image/png">
  <link rel="apple-touch-icon" href="../assets/images/Cahoon%20Logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Great+Vibes&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="masthead" data-header>
    <a class="brand" href="home.html"><img src="../assets/images/Cahoon%20Logo.png" alt="Alyssa and Liam Cahoon"></a>
    <button class="nav-toggle" type="button" data-nav-toggle aria-expanded="false" aria-controls="site-nav">
      <span class="nav-toggle-bar"></span>
      <span class="visually-hidden">Menu</span>
    </button>
    <nav class="site-nav" id="site-nav" data-nav>
      <ul class="nav-list">
        <li><a href="ourstory.html">Our Story</a></li>
        <li><a href="meetthecrew.html">The Crew</a></li>
        <li><a href="weddingdetails.html">Details</a></li>
        <li><a href="gallery.html">Gallery</a></li>
        <li><a href="registry.html">Registry</a></li>
        <li><a href="FAQs.html">FAQ</a></li>
        <li><a href="rsvp.html">RSVP</a></li>
      </ul>
    </nav>
  </header>

  <main id="main">
    <section class="hero page-hero">
      <p class="eyebrow">Kindly reply</p>
      <h1 class="hero-names">
        <span class="hero-name">RSVP</span>
      </h1>
      <div class="flourish flourish-sm" role="presentation"></div>
    </section>

    <section class="section rsvp">
      <div class="rsvp-panel reveal">
        <div class="section-heading">
          <p class="section-lede">We hope you can join us. Please respond by May 15, 2027. This form opens your email with the details filled in — no account required.</p>
        </div>
        <form class="rsvp-form" data-rsvp-form novalidate>
          <div class="form-row">
            <label for="guest-name">Your name</label>
            <input id="guest-name" name="name" type="text" autocomplete="name" required>
          </div>
          <div class="form-row">
            <label for="guest-email">Email</label>
            <input id="guest-email" name="email" type="email" autocomplete="email" required>
          </div>
          <div class="form-split">
            <div class="form-row">
              <label for="attending">Will you attend?</label>
              <select id="attending" name="attending" required>
                <option value="" disabled selected>Please choose</option>
                <option value="Joyfully accepts">Joyfully accepts</option>
                <option value="Regretfully declines">Regretfully declines</option>
              </select>
            </div>
            <div class="form-row">
              <label for="guests">Number of guests</label>
              <input id="guests" name="guests" type="number" min="1" max="6" value="1">
            </div>
          </div>
          <div class="form-row">
            <label for="message">Note for the couple <span class="optional">(optional)</span></label>
            <textarea id="message" name="message" rows="4" placeholder="A favorite memory, a song request, or a dietary note…"></textarea>
          </div>
          <p class="form-status" data-form-status hidden></p>
          <button class="btn" type="submit">Send RSVP</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <a class="footer-logo" href="home.html"><img src="../assets/images/Cahoon%20Logo.png" alt="Alyssa and Liam Cahoon"></a>
  </footer>

  <script src="../script.js"></script>
</body>
</html>
